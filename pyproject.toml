[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-mcp-agent"
dynamic = ["version"]
authors = [
    {name = "Linux MCP Team", email = "contact@linuxmcp.com"}
]
description = "Linux MCP Agent - Remote Linux Server Management via MCP for AI Clients"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["linux", "ssh", "mcp", "system-administration", "remote-management", "interactive-shell"]
dependencies = [
    "paramiko>=2.7.0",
    # 下界 1.10.0：工具用了 @mcp.tool(structured_output=False)，1.9.x 没有这个参数。
    # 上界 <2：mcp 2.0 移除了 mcp.server.fastmcp，本项目仍基于 1.x 的 FastMCP
    "mcp>=1.10.0,<2",
    # 工具体都跑在 anyio.to_thread 的工作线程里，直接 import 就显式声明
    "anyio>=4.5",
]

[project.urls]
Homepage = "https://github.com/2653533859/Linux-MCP"
"Bug Reports" = "https://github.com/2653533859/Linux-MCP/issues"
"Source" = "https://github.com/2653533859/Linux-MCP"
Documentation = "https://github.com/2653533859/Linux-MCP#readme"

[project.scripts]
linux-mcp-agent = "linux_mcp_toolkit.main:main"
linux-mcp-toolkit = "linux_mcp_toolkit.main:main"
linux-mcp = "linux_mcp_toolkit.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["linux_mcp_toolkit*"]

# 版本号唯一来源：linux_mcp_toolkit/__init__.py 的 __version__
[tool.setuptools.dynamic]
version = {attr = "linux_mcp_toolkit.__version__"}

[tool.setuptools.package-data]
"linux_mcp_toolkit" = ["*.json", "*.yaml", "*.txt", "*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]